<!DOCTYPE html>
<html>
<head>
    <title>Simple Test</title>
</head>
<body>
    <h1>Simple Form Test</h1>
    <form action="/predict" method="POST">
        <label>Gender:</label>
        <select name="gender" required>
            <option value="male">Male</option>
            <option value="female">Female</option>
        </select><br><br>
        
        <label>Hemoglobin:</label>
        <input type="number" name="hemoglobin" value="12.5" required><br><br>
        
        <label>MCV:</label>
        <input type="number" name="mcv" value="90" required><br><br>
        
        <label>MCH:</label>
        <input type="number" name="mch" value="30" required><br><br>
        
        <label>MCHC:</label>
        <input type="number" name="mchc" value="34" required><br><br>
        
        <button type="submit">SUBMIT</button>
    </form>
</body>
</html>
