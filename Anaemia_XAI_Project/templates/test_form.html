<!DOCTYPE html>
<html>
<head>
    <title>Test Form</title>
    <style>
        body { font-family: Arial; margin: 50px; }
        input { margin: 10px; padding: 5px; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Anaemia Prediction Test</h1>
    <form action="/predict" method="POST">
        <div>
            <label>Gender:</label>
            <select name="gender" required>
                <option value="male">Male</option>
                <option value="female">Female</option>
            </select>
        </div>
        <div>
            <label>Hemoglobin:</label>
            <input type="number" name="hemoglobin" value="12.5" step="0.1" required>
        </div>
        <div>
            <label>MCV:</label>
            <input type="number" name="mcv" value="90" required>
        </div>
        <div>
            <label>MCH:</label>
            <input type="number" name="mch" value="30" required>
        </div>
        <div>
            <label>MCHC:</label>
            <input type="number" name="mchc" value="34" required>
        </div>
        <div>
            <button type="submit">GET PREDICTION</button>
        </div>
    </form>
</body>
</html>
